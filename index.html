<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MMIW/AIM Unity Walk — Gaige Davila</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Karla:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #070707;
      --surface: #121212;
      --border:  #1e1e1e;
      --text:    #f5f0e8;
      --muted:   #444;
      --accent:  #b5292a;
      --gap:     3px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Karla', sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── HEADER ───────────────────────────────────────────── */
    header {
      padding: 64px 36px 48px;
      max-width: 1600px;
      margin: 0 auto;
    }

    .title-block {
      margin-bottom: 24px;
    }

    /* Replace the text below with your title once you have one */
    .page-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(32px, 6.5vw, 100px);
      letter-spacing: 0.01em;
      line-height: 0.88;
      text-align: center;
      white-space: nowrap;
      font-size: clamp(32px, 6.5vw, 100px);
      color: var(--text);
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 20px;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .meta-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    .meta-sep {
      width: 1px;
      height: 10px;
      background: var(--border);
      flex-shrink: 0;
    }

    /* ── GRID ─────────────────────────────────────────────── */
    /*
      6-column grid. Each photo gets one of these span widths:
        span-2 = 1/3 width
        span-3 = 1/2 width
        span-4 = 2/3 width
        span-6 = full width
      The layout pattern repeats every 10 photos — see JS below.
    */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: var(--gap);
    }

    .photo-item {
      position: relative;
      overflow: hidden;
      background: var(--surface);
      cursor: pointer;
    }

    .photo-inner {
      display: block;
    }

    .photo-inner img {
      width: 100%;
      height: auto;
      display: block;
      transition: opacity 0.3s ease;
      opacity: 0;
    }

    .photo-inner img.loaded {
      opacity: 1;
    }

    /* Placeholder shown when image hasn't loaded yet */
    .photo-label {
      font-family: 'Karla', sans-serif;
      font-size: 9px;
      letter-spacing: 0.12em;
      color: var(--border);
      text-align: center;
      user-select: none;
      position: absolute;
    }

    .span-2 { grid-column: span 2; }
    .span-3 { grid-column: span 3; }
    .span-4 { grid-column: span 4; }
    .span-6 { grid-column: span 6; }

    /* ── LIGHTBOX ─────────────────────────────────────────── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.96);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox-img {
      max-width: 92vw;
      max-height: 92vh;
      object-fit: contain;
      display: block;
    }

    .lightbox-close {
      position: fixed;
      top: 24px;
      right: 28px;
      font-family: 'Karla', sans-serif;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
      transition: color 0.2s;
    }

    .lightbox-close:hover { color: var(--text); }

    .lightbox-counter {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Karla', sans-serif;
      font-size: 10px;
      letter-spacing: 0.18em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .lightbox-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-size: 22px;
      padding: 20px;
      transition: color 0.2s;
      user-select: none;
    }

    .lightbox-nav:hover { color: var(--text); }
    .lightbox-nav.prev { left: 16px; }
    .lightbox-nav.next { right: 16px; }

    /* ── FOOTER ───────────────────────────────────────────── */
    footer {
      padding: 48px 36px;
      max-width: 1600px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
      margin-top: 48px;
    }

    .footer-credit {
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .footer-credit strong {
      color: var(--text);
      font-weight: 400;
    }

    /* ── RESPONSIVE ───────────────────────────────────────── */
    @media (max-width: 900px) {
      .photo-grid { grid-template-columns: repeat(4, 1fr); }
      .span-2 { grid-column: span 2; }
      .span-3 { grid-column: span 2; }
      .span-4 { grid-column: span 4; }
      .span-6 { grid-column: span 4; }
      .photo-item.span-6::before { padding-bottom: 56%; }
    }

    @media (max-width: 560px) {
      .photo-grid { grid-template-columns: repeat(2, 1fr); }
      .span-2, .span-3, .span-4, .span-6 { grid-column: span 2; }
      .photo-item::before, .photo-item.span-6::before { padding-bottom: 66.67%; }
      header { padding: 44px 20px 36px; }
      footer { padding: 36px 20px; flex-direction: column; gap: 12px; align-items: flex-start; }
    }

    /* ── DOWNLOAD PROTECTION ──────────────────────────────── */
    /* Transparent overlay sits on top of every photo,
       intercepting right-clicks and drags */
    .photo-shield {
      position: absolute;
      inset: 0;
      z-index: 10;
      -webkit-user-drag: none;
      user-select: none;
    }

    img {
      -webkit-user-drag: none;
      user-drag: none;
      user-select: none;
      -webkit-user-select: none;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- ── HEADER ──────────────────────────────────────────── -->
  <header>
    <div class="title-block">
      <!--
        Add your title here when ready.
        Example: <h1 class="page-title">March for the Missing</h1>
      -->
      <h1 class="page-title">MMIW/AIM Unity Walk</h1>
    </div>
    <div class="meta-row">
      <div class="meta-dot"></div>
      <span>Los Angeles, CA</span>
      <div class="meta-sep"></div>
      <span>May 5, 2026</span>
      <div class="meta-sep"></div>
      <span>Photography by Gaige Davila</span>
    </div>
  </header>

  <!-- ── PHOTO GRID ──────────────────────────────────────── -->
  <div class="photo-grid" id="grid"></div>

  <!-- ── LIGHTBOX ────────────────────────────────────────── -->
  <div class="lightbox" id="lightbox" role="dialog" aria-label="Photo viewer">
    <button class="lightbox-close" id="lb-close">Close ✕</button>
    <button class="lightbox-nav prev" id="lb-prev">&#8592;</button>
    <img class="lightbox-img" id="lb-img" src="" alt="" />
    <button class="lightbox-nav next" id="lb-next">&#8594;</button>
    <div class="lightbox-counter" id="lb-counter"></div>
  </div>

  <!-- ── FOOTER ──────────────────────────────────────────── -->
  <footer>
    <div class="footer-credit">Photography — <strong>Gaige Davila</strong></div>
    <div class="footer-credit">Los Angeles, CA &nbsp;·&nbsp; May 5, 2026</div>
  </footer>


  <script>
    /*
      ─────────────────────────────────────────────────────────
      PHOTO CONFIGURATION
      ─────────────────────────────────────────────────────────
      Put all your photos in a folder called "photos/" in the
      same directory as this HTML file.

      By default, photos are named:
        photo-01.jpg, photo-02.jpg, ... photo-70.jpg

      To use your own filenames, replace the array below with:
        const photoFiles = [
          'photos/your-file-name.jpg',
          'photos/another-file.jpg',
          ...
        ];
      ─────────────────────────────────────────────────────────
    */

    const TOTAL = 40;

    const photoFiles = Array.from({ length: TOTAL }, (_, i) =>
      `photo (${i + 1}).jpg`
    );

    /*
      Layout pattern — repeats every 10 photos.
      Numbers are column spans in a 6-column grid:
        2 = 1/3 width
        3 = 1/2 width
        4 = 2/3 width
        6 = full width

      Current pattern per group of 10:
        [4, 2]        — 2/3 wide + 1/3 wide
        [2, 2, 2]     — three equal thirds
        [6]           — full width feature
        [3, 3]        — two halves
        [2, 4]        — 1/3 wide + 2/3 wide
    */
    const spanPattern = [4, 2, 2, 2, 2, 6, 3, 3, 2, 4];

    // ── Build grid ──────────────────────────────────────────
    const grid = document.getElementById('grid');
    const imgEls = [];

    photoFiles.forEach((file, i) => {
      const span = spanPattern[i % spanPattern.length];

      const item = document.createElement('div');
      item.className = `photo-item span-${span}`;

      const inner = document.createElement('div');
      inner.className = 'photo-inner';

      const img = document.createElement('img');
      img.src = file;
      img.alt = `Photo ${i + 1}`;
      img.loading = 'lazy';

      img.onload = () => img.classList.add('loaded');

      img.onerror = () => {
        img.style.display = 'none';
        const label = document.createElement('div');
        label.className = 'photo-label';
        label.textContent = `photo-${String(i + 1).padStart(2, '0')}.jpg`;
        inner.appendChild(label);
      };

      imgEls.push({ img, file, index: i });

      // Transparent shield over each photo — blocks right-click and drag
      const shield = document.createElement('div');
      shield.className = 'photo-shield';
      shield.addEventListener('contextmenu', e => e.preventDefault());
      shield.addEventListener('dragstart', e => e.preventDefault());
      shield.addEventListener('click', () => openLightbox(i));

      inner.appendChild(img);
      item.appendChild(inner);
      item.appendChild(shield);
      grid.appendChild(item);
    });

    // ── Lightbox ────────────────────────────────────────────
    const lightbox  = document.getElementById('lightbox');
    const lbImg     = document.getElementById('lb-img');
    const lbCounter = document.getElementById('lb-counter');
    let current = 0;

    function openLightbox(i) {
      current = i;
      lbImg.src = imgEls[i].file;
      lbImg.alt = `Photo ${i + 1}`;
      lbCounter.textContent = `${i + 1} / ${TOTAL}`;
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      document.body.style.overflow = '';
    }

    function navigate(dir) {
      current = (current + dir + TOTAL) % TOTAL;
      lbImg.src = imgEls[current].file;
      lbCounter.textContent = `${current + 1} / ${TOTAL}`;
    }

    document.getElementById('lb-close').addEventListener('click', closeLightbox);
    document.getElementById('lb-prev').addEventListener('click', () => navigate(-1));
    document.getElementById('lb-next').addEventListener('click', () => navigate(1));

    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });

    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('open')) {
        // Block Ctrl+S (save), Ctrl+U (view source), Ctrl+Shift+I (devtools)
        if (e.ctrlKey && (e.key === 's' || e.key === 'u')) e.preventDefault();
        if (e.ctrlKey && e.shiftKey && e.key === 'I') e.preventDefault();
        return;
      }
      if (e.key === 'Escape')      closeLightbox();
      if (e.key === 'ArrowLeft')   navigate(-1);
      if (e.key === 'ArrowRight')  navigate(1);
    });

    // Block right-click globally on the page
    document.addEventListener('contextmenu', e => e.preventDefault());

    // Block drag on all images
    document.addEventListener('dragstart', e => {
      if (e.target.tagName === 'IMG') e.preventDefault();
    });
  </script>

</body>
</html>
